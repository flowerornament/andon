# Project-layer codex config. At session start, scripts/jj-identity writes this
# jj workspace's commit trailers (Jj-Workspace, Agent, Session) and names the
# tmux pane after the workspace; outside a jj repository it does nothing.
[[hooks.SessionStart]]
hooks = [{ type = "command", command = "bash \"$(jj workspace root 2>/dev/null || pwd)/scripts/jj-identity\" codex" }]

# andon: this seat's row at session start, and what changed since its last
# turn on each prompt (scripts/andon-hook.sh; silent when nothing changed).
[[hooks.SessionStart]]
hooks = [{ type = "command", command = "bash \"$(jj workspace root 2>/dev/null || pwd)/scripts/andon-hook.sh\"" }]

[[hooks.UserPromptSubmit]]
hooks = [{ type = "command", command = "bash \"$(jj workspace root 2>/dev/null || pwd)/scripts/andon-hook.sh\"" }]

[features]
hooks = true
